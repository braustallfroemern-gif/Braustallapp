<!DOCTYPE html>

    <style>

        #app {

        .btn-primary {

            color: white;
            border: none;
            padding: 18px 16px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.1);

        .btn-secondary-action {

            border-radius: 10px;

            padding: 12px 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #444;
            line-height: 1.4;
            text-align: left;
        }

        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;

    </script>
</body>
</html>
