<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Braustall - Lagerverwaltung</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome für Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Individuelle Akzent-Bordüren für die Malzkarten */
    .border-basismalz { border-left-color: #f59e0b !important; }      /* Amber / Goldgelb */
    .border-karamellmalz { border-left-color: #c2410c !important; }   /* Rostrot / Karamell */
    .border-roestmalz { border-left-color: #451a03 !important; }      /* Dunkelbraun / Espresso */
    .border-spezialmalz { border-left-color: #64748b !important; }    /* Schiefergrau */
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- NAVIGATION -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-beer-mug-empty text-amber-500 text-2xl"></i>
        <span class="font-bold text-xl tracking-wide text-amber-500">BRAUSTALL</span>
        <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">v2.1</span>
      </div>
      <nav class="flex space-x-2">
        <a href="lager.html" class="bg-amber-500/10 text-amber-500 border border-amber-500/30 px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked"></i> Lager
        </a>
        <a href="brautag.html" class="text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-fire-burner"></i> Brautag
        </a>
      </nav>
    </div>
  </header>

  <!-- HAUPTINHALT -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- TITEL & AKTIONEN -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white flex items-center gap-3">
          <i class="fa-solid fa-[#d97706] fa-wheat-awn text-amber-500"></i> Malzlager
        </h1>
        <p class="text-slate-400 text-sm mt-1">Übersicht aller Rohstoffe, kategorisiert und alphabetisch sortiert.</p>
      </div>
      <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2.5 rounded-lg shadow-lg hover:shadow-amber-500/20 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-plus"></i> Neues Malz anlegen
      </button>
    </div>

    <!-- FILTER & SUCHE -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center">
      <div class="relative w-full md:w-96">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderMalze()" placeholder="Malz suchen..." class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-amber-500">
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto">
        <label class="text-xs text-slate-400 whitespace-nowrap">Filter Kategorie:</label>
        <select id="categoryFilter" onchange="renderMalze()" class="bg-slate-900 border border-slate-700 text-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 w-full md:w-auto">
          <option value="ALL">Alle Kategorien</option>
          <option value="Basismalz">Basismalz</option>
          <option value="Karamellmalz">Karamellmalz</option>
          <option value="Röstmalz">Röstmalz</option>
          <option value="Spezial-/Hilfsmalz">Spezial-/Hilfsmalz</option>
        </select>
      </div>
    </div>

    <!-- MALZKARTEN GRID -->
    <div id="malzGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Wird dynamisch durch JavaScript befüllt -->
    </div>

    <!-- LEER-ZUSTAND (FALLS KEIN MALZ GEFUNDEN) -->
    <div id="emptyState" class="hidden text-center py-16 bg-slate-800/50 rounded-xl border border-slate-700/50">
      <i class="fa-solid fa-wheat-awn-circle-exclamation text-4xl text-slate-500 mb-3"></i>
      <h3 class="text-lg font-medium text-slate-300">Kein Malz gefunden</h3>
      <p class="text-slate-500 text-sm mt-1">Passe deine Suche an oder lege ein neues Malz an.</p>
    </div>

  </main>

  <!-- MODAL: MALZ ANLEGEN / BEARBEITEN -->
  <div id="malzModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
        <h3 id="modalTitle" class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-wheat-awn text-amber-500"></i> Neues Malz erfassen
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Formular -->
      <form id="malzForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="malzId">

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Malz Name *</label>
          <input type="text" id="malzName" required placeholder="z. B. Pilsner Malz, Special W" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Malz-Typ / Kategorie *</label>
            <select id="malzTyp" required class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
              <option value="Basismalz">Basismalz</option>
              <option value="Karamellmalz">Karamellmalz</option>
              <option value="Röstmalz">Röstmalz</option>
              <option value="Spezial-/Hilfsmalz">Spezial-/Hilfsmalz</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Bestand (kg) *</label>
            <input type="number" id="malzMenge" step="0.01" min="0" required placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Farbe (EBC)</label>
            <input type="number" id="malzEbc" step="0.1" min="0" placeholder="z. B. 4.0" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Max. Schüttung (%)</label>
            <input type="number" id="malzMaxSchuettung" min="0" max="100" placeholder="z. B. 100" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Aromatik & Beschreibung</label>
          <textarea id="malzAromatik" rows="3" placeholder="Geschmacksnoten, Einsatzbereich, Besonderheiten..." class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 resize-none"></textarea>
        </div>

        <!-- Modal Footer Buttons -->
        <div class="pt-4 border-t border-slate-700 flex justify-end gap-3">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-slate-400 hover:bg-slate-700 text-sm font-medium transition">
            Abbrechen
          </button>
          <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-5 py-2 rounded-lg text-sm transition">
            Speichern
          </button>
        </div>
      </form>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIK -->
  <script>
    // ------------------------------------------------------------------
    // 1. SUPABASE KONFIGURATION
    // ------------------------------------------------------------------
    const SUPABASE_URL = 'https://deine-supabase-url.supabase.co'; 
    const SUPABASE_KEY = 'dein-anon-key';
    
    let supabaseClient = null;
    if (typeof supabase !== 'undefined' && !SUPABASE_URL.includes('deine-supabase-url')) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // LocalStorage Fallback-Key für autarkes Testen ohne DB-Verbindung
    const LOCAL_STORAGE_KEY = 'braustall_malz_lager';

    // ------------------------------------------------------------------
    // 2. KATEGORIE-KONFIGURATION & FARBMAPPING
    // ------------------------------------------------------------------
    const KATEGORIE_KONFIG = {
      'Basismalz': {
        prio: 1,
        borderClass: 'border-basismalz',
        badgeClass: 'bg-amber-500/10 text-amber-400 border-amber-500/20'
      },
      'Karamellmalz': {
        prio: 2,
        borderClass: 'border-karamellmalz',
        badgeClass: 'bg-orange-500/10 text-orange-400 border-orange-500/20'
      },
      'Röstmalz': {
        prio: 3,
        borderClass: 'border-roestmalz',
        badgeClass: 'bg-stone-500/10 text-stone-300 border-stone-500/20'
      },
      'Spezial-/Hilfsmalz': {
        prio: 4,
        borderClass: 'border-spezialmalz',
        badgeClass: 'bg-slate-500/10 text-slate-300 border-slate-500/20'
      }
    };

    let malzLager = [];

    // Initialisierung beim Laden der Seite
    document.addEventListener('DOMContentLoaded', () => {
      loadMalze();
    });

    // ------------------------------------------------------------------
    // 3. DATEN LADEN
    // ------------------------------------------------------------------
    async function loadMalze() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('lager_malz').select('*');
          if (error) throw error;
          malzLager = data || [];
        } catch (err) {
          console.warn('Supabase Fehler, verwende LocalStorage Fallback:', err);
          loadFromLocalStorage();
        }
      } else {
        loadFromLocalStorage();
      }
      renderMalze();
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        malzLager = JSON.parse(stored);
      } else {
        // Demodaten zur Veranschaulichung
        malzLager = [
          { id: '1', name: 'Pilsner Malz', typ: 'Basismalz', menge: 25.0, ebc: 3.5, max_schuettung: 100, aromatik: 'Helles Getreide, frisches Stroh, schlanker Körper.' },
          { id: '2', name: 'Caraaroma', typ: 'Karamellmalz', menge: 2.5, ebc: 350.0, max_schuettung: 15, aromatik: 'Intensives Karamell, Trockenfrüchte, Nüsse.' },
          { id: '3', name: 'Carared', typ: 'Karamellmalz', menge: 5.0, ebc: 50.0, max_schuettung: 25, aromatik: 'Malzsüße, Honig, Biskuit, leuchtende Rotfärbung.' },
          { id: '4', name: 'Röstgerste', typ: 'Röstmalz', menge: 1.2, ebc: 1100.0, max_schuettung: 5, aromatik: 'Kräftiger Espresso, Zartbitterschokolade, trocken.' },
          { id: '5', name: 'Reisflocken', typ: 'Spezial-/Hilfsmalz', menge: 3.0, ebc: 1.0, max_schuettung: 30, aromatik: 'Geschmacksneutral, erzeugt extrem schlanken, spritzigen Körper (Corona/Estrella-Stil). Kein Vorkochen nötig.' }
        ];
        saveToLocalStorage();
      }
    }

    function saveToLocalStorage() {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(malzLager));
    }

    // ------------------------------------------------------------------
    // 4. SORTIERUNGS-LOGIK (Kategorie Priorität -> Alphabetisch)
    // ------------------------------------------------------------------
    function sortiereMalze(liste) {
      return [...liste].sort((a, b) => {
        const prioA = KATEGORIE_KONFIG[a.typ]?.prio || 99;
        const prioB = KATEGORIE_KONFIG[b.typ]?.prio || 99;

        // Primary: Sortierung nach Gruppierung (Basismalz -> Karamell -> Röst -> Spezial)
        if (prioA !== prioB) {
          return prioA - prioB;
        }

        // Secondary: Alphabetisch nach Malzname
        return (a.name || '').localeCompare(b.name || '', 'de', { sensitivity: 'base' });
      });
    }

    // ------------------------------------------------------------------
    // 5. RENDERING DER KARTEN
    // ------------------------------------------------------------------
    function renderMalze() {
      const grid = document.getElementById('malzGrid');
      const emptyState = document.getElementById('emptyState');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const filterVal = document.getElementById('categoryFilter').value;

      // Filter anwenden
      let gefiltert = malzLager.filter(m => {
        const matchSearch = (m.name || '').toLowerCase().includes(searchVal) || 
                            (m.aromatik || '').toLowerCase().includes(searchVal);
        const matchCat = filterVal === 'ALL' || m.typ === filterVal;
        return matchSearch && matchCat;
      });

      // Sortierung anwenden
      const sortierteMalze = sortiereMalze(gefiltert);

      if (sortierteMalze.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      grid.innerHTML = sortierteMalze.map(malz => {
        const konfig = KATEGORIE_KONFIG[malz.typ] || {
          borderClass: 'border-slate-600',
          badgeClass: 'bg-slate-700 text-slate-300'
        };

        return `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex flex-col justify-between border-l-4 ${konfig.borderClass} hover:border-slate-600 transition">
            
            <!-- Karten Kopfbereich -->
            <div>
              <div class="flex justify-between items-start gap-2 mb-3">
                <h3 class="font-bold text-lg text-white tracking-wide">${escapeHtml(malz.name)}</h3>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${konfig.badgeClass} whitespace-nowrap">
                  ${escapeHtml(malz.typ || 'Unkategorisiert')}
                </span>
              </div>

              <!-- Kennzahlen Grid -->
              <div class="grid grid-cols-3 gap-2 bg-slate-900/60 rounded-lg p-2.5 mb-4 text-center border border-slate-700/50">
                <div>
                  <span class="block text-[10px] text-slate-400 uppercase font-semibold">Bestand</span>
                  <span class="font-bold text-amber-400 text-sm">${parseFloat(malz.menge || 0).toFixed(2)} kg</span>
                </div>
                <div>
                  <span class="block text-[10px] text-slate-400 uppercase font-semibold">Farbe</span>
                  <span class="font-medium text-slate-200 text-sm">${malz.ebc ? malz.ebc + ' EBC' : '-'}</span>
                </div>
                <div>
                  <span class="block text-[10px] text-slate-400 uppercase font-semibold">Max. Schütt.</span>
                  <span class="font-medium text-slate-200 text-sm">${malz.max_schuettung ? malz.max_schuettung + ' %' : '-'}</span>
                </div>
              </div>

              <!-- Aromatik & Beschreibung -->
              ${malz.aromatik ? `
                <p class="text-xs text-slate-300 bg-slate-900/30 p-2.5 rounded-lg border border-slate-700/30 mb-4 line-clamp-3 leading-relaxed">
                  <i class="fa-solid fa-align-left text-slate-500 mr-1.5"></i>${escapeHtml(malz.aromatik)}
                </p>
              ` : ''}
            </div>

            <!-- Karten Fußbereich / Aktionen -->
            <div class="pt-3 border-t border-slate-700/60 flex items-center justify-between mt-auto">
              <!-- Bestand Schnell-Korrektur -->
              <div class="flex items-center gap-1">
                <button onclick="adjustQuantity('${malz.id}', -0.5)" title="- 0.5 kg" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 text-xs transition">
                  <i class="fa-solid fa-minus"></i>
                </button>
                <button onclick="adjustQuantity('${malz.id}', 0.5)" title="+ 0.5 kg" class="w-7 h-7 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 text-xs transition">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>

              <!-- Bearbeiten / Löschen -->
              <div class="flex items-center gap-2">
                <button onclick="editMalz('${malz.id}')" class="text-slate-400 hover:text-amber-400 text-sm p-1 transition" title="Bearbeiten">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button onclick="deleteMalz('${malz.id}')" class="text-slate-400 hover:text-red-400 text-sm p-1 transition" title="Löschen">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    // ------------------------------------------------------------------
    // 6. MODAL & SPEICHER-AKTIONEN
    // ------------------------------------------------------------------
    function openModal(malzObj = null) {
      const modal = document.getElementById('malzModal');
      const form = document.getElementById('malzForm');
      
      form.reset();

      if (malzObj) {
        document.getElementById('modalTitle').innerText = 'Malz bearbeiten';
        document.getElementById('malzId').value = malzObj.id;
        document.getElementById('malzName').value = malzObj.name || '';
        document.getElementById('malzTyp').value = malzObj.typ || 'Basismalz';
        document.getElementById('malzMenge').value = malzObj.menge || '';
        document.getElementById('malzEbc').value = malzObj.ebc || '';
        document.getElementById('malzMaxSchuettung').value = malzObj.max_schuettung || '';
        document.getElementById('malzAromatik').value = malzObj.aromatik || '';
      } else {
        document.getElementById('modalTitle').innerText = 'Neues Malz erfassen';
        document.getElementById('malzId').value = '';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('malzModal').classList.add('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      const id = document.getElementById('malzId').value || String(Date.now());
      const payload = {
        id: id,
        name: document.getElementById('malzName').value.trim(),
        typ: document.getElementById('malzTyp').value,
        menge: parseFloat(document.getElementById('malzMenge').value) || 0,
        ebc: document.getElementById('malzEbc').value ? parseFloat(document.getElementById('malzEbc').value) : null,
        max_schuettung: document.getElementById('malzMaxSchuettung').value ? parseInt(document.getElementById('malzMaxSchuettung').value) : null,
        aromatik: document.getElementById('malzAromatik').value.trim()
      };

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('lager_malz').upsert([payload]);
          if (error) throw error;
        } catch (err) {
          console.error('Fehler beim Speichern in Supabase:', err);
        }
      }

      // Lokal aktualisieren
      const idx = malzLager.findIndex(m => String(m.id) === String(id));
      if (idx >= 0) {
        malzLager[idx] = payload;
      } else {
        malzLager.push(payload);
      }

      saveToLocalStorage();
      closeModal();
      renderMalze();
    }

    async function adjustQuantity(id, delta) {
      const malz = malzLager.find(m => String(m.id) === String(id));
      if (!malz) return;

      const neueMenge = Math.max(0, parseFloat((malz.menge + delta).toFixed(2)));
      malz.menge = neueMenge;

      if (supabaseClient) {
        try {
          await supabaseClient.from('lager_malz').update({ menge: neueMenge }).eq('id', id);
        } catch (err) {
          console.error('Fehler beim Anpassen der Menge in Supabase:', err);
        }
      }

      saveToLocalStorage();
      renderMalze();
    }

    function editMalz(id) {
      const malz = malzLager.find(m => String(m.id) === String(id));
      if (malz) {
        openModal(malz);
      }
    }

    async function deleteMalz(id) {
      if (!confirm('Möchtest du dieses Malz wirklich aus dem Lager entfernen?')) return;

      if (supabaseClient) {
        try {
          await supabaseClient.from('lager_malz').delete().eq('id', id);
        } catch (err) {
          console.error('Fehler beim Löschen aus Supabase:', err);
        }
      }

      malzLager = malzLager.filter(m => String(m.id) !== String(id));
      saveToLocalStorage();
      renderMalze();
    }

    // Hilfsfunktion gegen XSS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
